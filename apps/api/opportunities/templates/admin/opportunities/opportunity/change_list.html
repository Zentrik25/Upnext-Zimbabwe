{% extends "admin/change_list.html" %}

{% block object-tools %}
{% if status_tabs %}
<nav class="tabs" aria-label="Filter opportunities by status">
  {% for tab in status_tabs %}
  <a class="tabs__tab{% if tab.current %} is-current{% endif %}" href="{{ tab.href }}"{% if tab.current %} aria-current="page"{% endif %}>
    {{ tab.label }}<span class="tabs__count">{{ tab.count }}</span>
  </a>
  {% endfor %}
</nav>
{% endif %}
{{ block.super }}
{% endblock %}
