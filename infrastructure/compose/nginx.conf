# LOCAL DEVELOPMENT ONLY. Mirrors the intended same-origin path routing (SECURITY_ARCHITECTURE §2):
#   /api/, /health/, /django-admin/, /static/ -> Django    everything else -> Next.js
# This is NOT the production proxy: production uses the shared Traefik -> Nginx, which must be
# inspected read-only and approved before any deployment work (OQ-10). Nothing here touches it.
server_tokens off;

# Only upgrade to WebSocket when the client asks (Next.js hot reloading in development).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1m;

    # The dev proxy is the only hop, so it overwrites forwarding headers instead of appending.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;

    location ~ ^/(api|health|django-admin|static)/ {
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://web:3000;
        # nginx drops inherited proxy_set_header directives as soon as a location sets its own, so repeat them.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        # WebSocket upgrade for Next.js hot reloading
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
