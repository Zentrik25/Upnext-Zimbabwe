# LOCAL TLS REHEARSAL ONLY (compose.tls.yaml). A throwaway certificate on localhost lets the stack be checked
# for HTTPS behaviour (Secure cookies, __Host- prefix, HSTS, redirects, proxy header trust) without any
# deployment. It is NOT the production proxy (shared Traefik -> Nginx, OQ-10) and touches nothing there.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    http2 on;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 1m;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID      $request_id;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;

    location ~ ^/(api|health|django-admin|static)/ {
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://web:3000;
        # nginx drops inherited proxy_set_header directives as soon as a location sets its own, so repeat them.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
